<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global NFT Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.header{
background:#ffffff;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.logo{
font-size:22px;
font-weight:bold;
color:#0a84ff;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:#0a84ff;
}

.balance-card{
margin:20px;
padding:20px;
border-radius:20px;
background:linear-gradient(135deg,#0a84ff,#4da3ff);
color:white;
}

.balance{
font-size:34px;
font-weight:bold;
margin-top:10px;
}

.menu{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding:20px;
}

.item{
background:white;
padding:18px;
border-radius:18px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
font-size:14px;
font-weight:bold;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
padding:15px;
box-shadow:0 -2px 10px rgba(0,0,0,.08);
}
</style>

</head>

<body>

<div class="header">

<div class="logo">
Global NFT
</div>

<div class="avatar"></div>

</div>

<div class="balance-card">

<p>Total Balance</p>

<div class="balance">$0.00</div>

<p>Today's Profit : $0.00</p>

</div>

<div class="menu">

<div class="item">Deposit</div>

<div class="item">Withdraw</div>

<div class="item">Referral</div>

<div class="item">Tasks</div>

<div class="item">Wallet</div>

<div class="item">Investment</div>

<div class="item">History</div>

<div class="item">Profile</div>

</div>

<div class="bottom">

<span>🏠 Home</span>

<span>💰 Wallet</span>

<span>📈 Invest</span>

<span>👤 Me</span>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Global NFT App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; text-align: center; background: var(--tg-theme-bg-color, #f4f4f9); color: var(--tg-theme-text-color, #000); }
    .nft-card { background: var(--tg-theme-secondary-bg-color, white); padding: 15px; margin: 10px auto; width: 80%; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    button { background: #4CAF50; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Global NFT Collection</h1>
  <div id="nft-list">Loading...</div>

  <script>
    // Initialize Telegram Web App
    window.Telegram.WebApp.ready();

    fetch('/api/nfts')
      .then(res => res.json())
      .then(data => {
        const c = document.getElementById('nft-list');
        c.innerHTML = '';
        data.forEach(n => {
          c.innerHTML += `<div class="nft-card"><h3>${n.name}</h3><p>Price: ${n.price}</p><button onclick="alert('Purchased ${n.name}!')">Buy Now</button></div>`;
        });
      });
  </script>
</body>
</html>

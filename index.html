<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
// Initialize EmailJS with your Public Key
emailjs.init("qjxvR3dIIlRvcnhXgs");

let generatedCode = "";

function getCode() {

    let emailField = document.getElementById("e").value.trim();

    if (!emailField || !emailField.includes("@gmail.com")) {
        alert("Please enter a valid Gmail address.");
        return;
    }

    // Generate 4-digit code
    generatedCode = Math.floor(1000 + Math.random() * 9000).toString();

    document.getElementById("code-show").innerText = "(Code: " + generatedCode + ")";

    // Prepare template parameters for EmailJS
    const templateParams = {
        to_email: emailField,
        passcode: generatedCode
    };

    // Send the email via EmailJS
    emailjs.send("service_6azrj1h", "template_d2ry4oq", templateParams)
        .then(function(response) {
            console.log("SUCCESS!", response.status, response.text);
            alert("Verification Code sent successfully to your Gmail!");
        }, function(error) {
            console.log("FAILED...", error);
            alert("Failed to send email. Please check your network.");
        });
}

function register() {

    let user = document.getElementById("u").value.trim();
    let codeInput = document.getElementById("c").value.trim();
    let pass = document.getElementById("p").value.trim();

    if (!user || !codeInput || !pass) {
        alert("Please fill out all fields.");
        return;
    }

    if (codeInput !== generatedCode) {
        alert("Incorrect verification code! Click Get Code first.");
        return;
    }

    alert("Registration Successful! Account created.");
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global NFT Collection</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
        }
        .nft-card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nft-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }
        .nft-info p {
            margin: 0;
            font-size: 14px;
            color: #888;
        }
        .buy-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Global NFT Collection</h1>
    
    <div id="app">
        <div class="nft-card">
            <div class="nft-info">
                <h3>Cyber Ape #001</h3>
                <p>Price: 1.5 ETH</p>
            </div>
            <button class="buy-btn" onclick="alert('NFT Purchased!')">Buy</button>
        </div>

        <div class="nft-card">
            <div class="nft-info">
                <h3>Cosmic Punk #404</h3>
                <p>Price: 0.8 ETH</p>
            </div>
            <button class="buy-btn" onclick="alert('NFT Purchased!')">Buy</button>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App SDK safely
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>

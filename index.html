<script>
let generatedCode = "";

function getCode() {

    let emailField = document.getElementById("e").value.trim();

    if (!emailField || !emailField.includes("@gmail.com")) {
        alert("Please enter a valid Gmail address.");
        return;
    }

    generatedCode = Math.floor(1000 + Math.random() * 9000).toString();

    document.getElementById("code-show").innerText = "(Code: " + generatedCode + ")";

    alert("Verification Code Generated Successfully: " + generatedCode);
}

function register() {

    let user = document.getElementById("u").value.trim();
    let codeInput = document.getElementById("c").value.trim();
    let pass = document.getElementById("p").value.trim();

    if (!user || !codeInput || !pass) {
        alert("Please fill out all fields.");
        return;
    }

    if (codeInput !== generatedCode) {
        alert("Incorrect verification code! Click Get Code first.");
        return;
    }

    alert("Registration Successful! Account created.");
}
</script>
